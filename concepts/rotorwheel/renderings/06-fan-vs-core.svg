<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" role="img" aria-label="Two rotor-wheels drawn at the same scale, each producing the 675 pounds of thrust one TW-2 wheel needs to hover. On the left, the module as designed: a 52 inch ducted fan fills the 60 inch wheel, giving 14.8 square feet of disc, 45.8 pounds per square foot, a slow 134 mph wash and 120 horsepower ideal. On the right, the same core driving a conventional turbofan would need a fan only 10.8 inches across, lost in the middle of the same wheel: 0.64 square feet of disc, 1,051 pounds per square foot, a 539 mph hot jet and 485 horsepower ideal — five times the power for the same lift." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E8571F"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="14">Same wheel · same 675 lbf of thrust · drawn to scale</text>

  <!-- ================= panel A: specified rotor-wheel ================= -->
  <g>
    <circle cx="250" cy="235" r="140" fill="none" stroke="currentColor" stroke-width="7"/>
    <circle cx="250" cy="235" r="122" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="250" cy="235" r="118" fill="none" stroke="#E8571F" stroke-width="2.5"/>
    <circle cx="250" cy="235" r="26" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="250" cy="235" r="8" fill="currentColor"/>
    <g stroke="#E8571F" stroke-width="13" stroke-linecap="round">
      <line x1="282" y1="235" x2="362" y2="235"/>
      <line x1="272" y1="260" x2="322" y2="325"/>
      <line x1="243" y1="268" x2="228" y2="349"/>
      <line x1="226" y1="252" x2="150" y2="288"/>
      <line x1="226" y1="218" x2="150" y2="182"/>
      <line x1="243" y1="202" x2="228" y2="121"/>
      <line x1="272" y1="210" x2="322" y2="145"/>
    </g>
    <!-- slow wide wash -->
    <g stroke="#E8571F" stroke-width="3" opacity="0.85">
      <line x1="140" y1="390" x2="140" y2="424" marker-end="url(#af)"/>
      <line x1="195" y1="390" x2="195" y2="424" marker-end="url(#af)"/>
      <line x1="250" y1="390" x2="250" y2="424" marker-end="url(#af)"/>
      <line x1="305" y1="390" x2="305" y2="424" marker-end="url(#af)"/>
      <line x1="360" y1="390" x2="360" y2="424" marker-end="url(#af)"/>
    </g>
  </g>

  <!-- ================= panel B: matched turbofan ================= -->
  <g>
    <circle cx="690" cy="235" r="140" fill="none" stroke="currentColor" stroke-width="7"/>
    <circle cx="690" cy="235" r="122" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- dead annulus -->
    <circle cx="690" cy="235" r="118" fill="currentColor" opacity="0.07"/>
    <!-- struts -->
    <g stroke="currentColor" stroke-width="3" opacity="0.6">
      <line x1="690" y1="212" x2="690" y2="117"/>
      <line x1="690" y1="258" x2="690" y2="353"/>
      <line x1="667" y1="235" x2="572" y2="235"/>
      <line x1="713" y1="235" x2="808" y2="235"/>
    </g>
    <!-- the matched turbofan, true scale: fan Ø 0.23 m = 46 px -->
    <circle cx="690" cy="235" r="27" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="690" cy="235" r="23" fill="none" stroke="#E8571F" stroke-width="2.5"/>
    <circle cx="690" cy="235" r="6" fill="currentColor"/>
    <g stroke="#E8571F" stroke-width="4" stroke-linecap="round">
      <line x1="696" y1="235" x2="719" y2="235"/>
      <line x1="694" y1="242" x2="708" y2="260"/>
      <line x1="686" y1="244" x2="682" y2="267"/>
      <line x1="681" y1="240" x2="659" y2="250"/>
      <line x1="681" y1="230" x2="659" y2="220"/>
      <line x1="686" y1="226" x2="682" y2="203"/>
      <line x1="694" y1="228" x2="708" y2="210"/>
    </g>
    <!-- narrow hot fast jet -->
    <g stroke="#E8571F" stroke-width="4" opacity="0.95">
      <line x1="676" y1="390" x2="676" y2="470" marker-end="url(#af)"/>
      <line x1="690" y1="390" x2="690" y2="470" marker-end="url(#af)"/>
      <line x1="704" y1="390" x2="704" y2="470" marker-end="url(#af)"/>
    </g>
    <line x1="716" y1="430" x2="760" y2="430" stroke="currentColor" stroke-width="1"/>
    <text x="766" y="425" font-size="11">537 mph,</text>
    <text x="766" y="440" font-size="11">570 °F+</text>
    <line x1="612" y1="157" x2="640" y2="92" stroke="currentColor" stroke-width="1"/>
    <text x="648" y="88" font-size="11">the rest of the wheel would do nothing</text>
  </g>

  <!-- ================= captions ================= -->
  <g font-size="13">
    <text x="250" y="510" text-anchor="middle" font-size="14">WHAT THE MODULE DOES</text>
    <text x="250" y="532" text-anchor="middle">ducted fan Ø 52 in fills the Ø 60 in wheel</text>
    <text x="250" y="554" text-anchor="middle">disc 14.8 ft² · 45.8 lb/ft²</text>
    <text x="250" y="576" text-anchor="middle">wash 134 mph · <tspan font-size="15">120 hp ideal</tspan></text>

    <text x="690" y="510" text-anchor="middle" font-size="14">IF THE CORE DROVE A CONVENTIONAL TURBOFAN</text>
    <text x="690" y="532" text-anchor="middle">fan Ø 10.8 in (BPR 8, FPR 1.4)</text>
    <text x="690" y="554" text-anchor="middle">disc 0.64 ft² — 1/23 the area · 1,051 lb/ft²</text>
    <text x="690" y="576" text-anchor="middle">jet 539 mph · <tspan font-size="15" fill="#E8571F">485 hp ideal</tspan></text>
  </g>
  <line x1="470" y1="95" x2="470" y2="590" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text x="30" y="608" font-size="12">Hover power ∝ 1/√(disc area). This is why the core is small and buried, and the fan fills the rim: bypass ratio ≈ 100.</text>
</svg>
