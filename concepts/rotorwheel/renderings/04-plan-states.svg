<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-label="Plan view in both states. Left, drive mode: the four turbine-wheels stand vertical and tucked against a lean hull, overall track ninety-two inches and overall width ninety-two inches, narrow enough for a road lane. Right, flight mode: the modules have slid twenty-two inches outboard on their rails and rotated flat, so the four fifty-two inch discs sit clear of the hull with a track of one hundred thirty-six inches and a disc span of one hundred eighty-eight inches. The hull planform is unchanged; only the modules move." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
    <g id="hullplan">
      <path d="M0,-198 L26,-150 L52,-40 L60,80 L52,190 L-52,190 L-60,80 L-52,-40 L-26,-150 Z"
            fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-40,-56 L-40,120 M40,-56 L40,120" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 4"/>
      <ellipse cx="0" cy="-10" rx="34" ry="54" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="0" cy="-182" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
    <g id="wvert">
      <rect x="-16" y="-60" width="32" height="120" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
      <line x1="0" y1="-54" x2="0" y2="54" stroke="#E8571F" stroke-width="3"/>
      <circle r="8" fill="currentColor"/>
    </g>
    <g id="wflat">
      <circle r="52" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle r="44" fill="none" stroke="#E8571F" stroke-width="2.5"/>
      <circle r="13" fill="currentColor"/>
      <g stroke="#E8571F" stroke-width="5" stroke-linecap="round">
        <line x1="15" y1="0" x2="41" y2="0"/><line x1="7" y1="13" x2="20" y2="36"/>
        <line x1="-7" y1="13" x2="-20" y2="36"/><line x1="-15" y1="0" x2="-41" y2="0"/>
        <line x1="-7" y1="-13" x2="-20" y2="-36"/><line x1="7" y1="-13" x2="20" y2="-36"/>
      </g>
    </g>
  </defs>

  <!-- ===== DRIVE ===== -->
  <g transform="translate(240,250)">
    <use href="#hullplan"/>
    <use href="#wvert" x="-92" y="-120"/><use href="#wvert" x="92" y="-120"/>
    <use href="#wvert" x="-92" y="120"/><use href="#wvert" x="92" y="120"/>
    <g stroke="currentColor" stroke-width="1">
      <line x1="-92" y1="214" x2="-92" y2="250"/><line x1="92" y1="214" x2="92" y2="250"/>
      <line x1="-85" y1="244" x2="85" y2="244" marker-start="url(#p1)" marker-end="url(#p1)"/>
    </g>
    <text x="0" y="238" text-anchor="middle" font-size="11">track 92</text>
  </g>
  <text x="240" y="534" text-anchor="middle" font-size="15">DRIVE</text>
  <text x="240" y="556" text-anchor="middle" font-size="12">overall width 92 — one road lane</text>

  <!-- ===== FLIGHT ===== -->
  <g transform="translate(700,250)">
    <use href="#hullplan"/>
    <use href="#wflat" x="-136" y="-120"/><use href="#wflat" x="136" y="-120"/>
    <use href="#wflat" x="-136" y="120"/><use href="#wflat" x="136" y="120"/>
    <g opacity="0.25">
      <use href="#wvert" x="-92" y="-120"/><use href="#wvert" x="92" y="-120"/>
      <use href="#wvert" x="-92" y="120"/><use href="#wvert" x="92" y="120"/>
    </g>
    <g stroke="currentColor" stroke-width="1.5">
      <line x1="92" y1="-120" x2="130" y2="-120" marker-end="url(#p1)"/>
      <line x1="-92" y1="-120" x2="-130" y2="-120" marker-end="url(#p1)"/>
    </g>
    <g stroke="currentColor" stroke-width="1">
      <line x1="-136" y1="214" x2="-136" y2="250"/><line x1="136" y1="214" x2="136" y2="250"/>
      <line x1="-129" y1="244" x2="129" y2="244" marker-start="url(#p1)" marker-end="url(#p1)"/>
      <line x1="-188" y1="-172" x2="-188" y2="-120"/><line x1="188" y1="-172" x2="188" y2="-120"/>
      <line x1="-181" y1="-178" x2="181" y2="-178" marker-start="url(#p1)" marker-end="url(#p1)"/>
    </g>
    <text x="0" y="238" text-anchor="middle" font-size="11">track 136</text>
    <text x="0" y="-186" text-anchor="middle" font-size="11">disc span 188</text>
  </g>
  <text x="700" y="534" text-anchor="middle" font-size="15">FLIGHT</text>
  <text x="700" y="556" text-anchor="middle" font-size="12">modules slid out 22 a side, discs flat and clear of the hull</text>

  <text x="26" y="32" font-size="14">TW-2 FERRET · plan · both states · 1 px = 0.5 in · the hull never changes, only the modules move</text>
</svg>
