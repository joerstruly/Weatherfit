<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 470" role="img" aria-label="Drive-to-flight transition in three front-view frames: at t plus 0 seconds the vehicle drives on vertical wheels; at t plus 1.8 seconds the body settles onto belly skids while the wheels tilt outboard; at t plus 3.5 seconds the fan discs are horizontal and the vehicle lifts off." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ground -->
  <line x1="20" y1="390" x2="1120" y2="390" stroke="currentColor" stroke-width="2"/>
  <g stroke="currentColor" stroke-width="1" opacity="0.5">
    <line x1="60" y1="390" x2="50" y2="402"/><line x1="180" y1="390" x2="170" y2="402"/>
    <line x1="300" y1="390" x2="290" y2="402"/><line x1="430" y1="390" x2="420" y2="402"/>
    <line x1="550" y1="390" x2="540" y2="402"/><line x1="670" y1="390" x2="660" y2="402"/>
    <line x1="800" y1="390" x2="790" y2="402"/><line x1="930" y1="390" x2="920" y2="402"/>
    <line x1="1060" y1="390" x2="1050" y2="402"/>
  </g>

  <!-- frame 1: drive -->
  <g>
    <rect x="105" y="205" width="150" height="90" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <rect x="25" y="130" width="65" height="260" rx="14" fill="none" stroke="currentColor" stroke-width="3"/>
    <rect x="270" y="130" width="65" height="260" rx="14" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="90" y1="250" x2="105" y2="250" stroke="currentColor" stroke-width="6"/>
    <line x1="255" y1="250" x2="270" y2="250" stroke="currentColor" stroke-width="6"/>
  </g>
  <text x="180" y="435" text-anchor="middle">t + 0.0 s — DRIVE</text>

  <!-- frame 2: tilt-out, on belly skids -->
  <g>
    <rect x="470" y="290" width="150" height="90" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <rect x="492" y="380" width="26" height="10" fill="currentColor"/>
    <rect x="572" y="380" width="26" height="10" fill="currentColor"/>
    <line x1="470" y1="310" x2="405" y2="255" stroke="currentColor" stroke-width="6"/>
    <line x1="620" y1="310" x2="685" y2="255" stroke="currentColor" stroke-width="6"/>
    <rect x="372" y="125" width="65" height="260" rx="14" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(-50 405 255)"/>
    <rect x="652" y="125" width="65" height="260" rx="14" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(50 685 255)"/>
    <path d="M330,180 A110,110 0 0 1 430,105" fill="none" stroke="#E8571F" stroke-width="2.5" marker-end="url(#a4)" color="#E8571F"/>
    <path d="M760,180 A110,110 0 0 0 660,105" fill="none" stroke="#E8571F" stroke-width="2.5" marker-end="url(#a4)" color="#E8571F"/>
  </g>
  <text x="545" y="435" text-anchor="middle">t + 1.8 s — TILT-OUT · belly skids take load</text>

  <!-- frame 3: lift -->
  <g>
    <rect x="855" y="150" width="150" height="90" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <rect x="725" y="170" width="130" height="50" rx="12" fill="none" stroke="currentColor" stroke-width="3"/>
    <rect x="1005" y="170" width="130" height="50" rx="12" fill="none" stroke="currentColor" stroke-width="3"/>
    <g stroke="currentColor" stroke-width="1.5">
      <line x1="755" y1="235" x2="755" y2="285" marker-end="url(#a4)"/>
      <line x1="790" y1="235" x2="790" y2="285" marker-end="url(#a4)"/>
      <line x1="825" y1="235" x2="825" y2="285" marker-end="url(#a4)"/>
      <line x1="1035" y1="235" x2="1035" y2="285" marker-end="url(#a4)"/>
      <line x1="1070" y1="235" x2="1070" y2="285" marker-end="url(#a4)"/>
      <line x1="1105" y1="235" x2="1105" y2="285" marker-end="url(#a4)"/>
    </g>
    <line x1="930" y1="125" x2="930" y2="60" stroke="#E8571F" stroke-width="3.5" marker-end="url(#a4)" color="#E8571F"/>
    <text x="944" y="80" fill="#E8571F">lift</text>
    <ellipse cx="930" cy="385" rx="130" ry="6" fill="currentColor" opacity="0.25"/>
  </g>
  <text x="930" y="435" text-anchor="middle">t + 3.5 s — LIFT · tail fan boosting</text>

  <text x="24" y="34">RW-5 FERRET · drive → flight transition · front view</text>
</svg>
