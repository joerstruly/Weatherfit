<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 466" role="img" aria-label="The four-beat takeoff transformation, seen from the front. Beat one, SPOOL: the vehicle stands on four vertical wheels, turbines already running, their ducts facing inboard into a sculpted channel along each flank that turns the flow rearward, so a spooled turbine pushes the vehicle forward on the ground instead of lifting it. Beat two, ROLL-IN: each wheel rotates thirty-eight degrees with its top tipping inboard, swinging the thrust vector from horizontal to down-and-inboard; lateral components still cancel across the vehicle while the vertical component unloads the suspension. Beat three, SLIDE-OUT: the modules translate twenty-two inches outboard on their rails, clearing the discs from the hull and widening the track from ninety-two to one hundred thirty-six inches. Beat four, ROLL-OUT: rotation completes to ninety-five degrees, the discs go flat, thrust is fully vertical and the vehicle lifts off." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E8571F"/>
    </marker>
    <marker id="na" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
    <!-- one turbine-wheel module, seen edge-on from the front; axis points -x (inboard) -->
    <g id="mod">
      <rect x="-13" y="-48" width="26" height="96" rx="9" fill="none" stroke="currentColor" stroke-width="4"/>
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#E8571F" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="9" fill="currentColor"/>
      <line x1="-15" y1="0" x2="-44" y2="0" stroke="#E8571F" stroke-width="3" marker-end="url(#fa)"/>
      <line x1="-15" y1="-22" x2="-36" y2="-22" stroke="#E8571F" stroke-width="2" marker-end="url(#fa)" opacity="0.75"/>
      <line x1="-15" y1="22" x2="-36" y2="22" stroke="#E8571F" stroke-width="2" marker-end="url(#fa)" opacity="0.75"/>
    </g>
    <!-- hull, front section: rounded body, canopy, flank reaction channel -->
    <g id="hull">
      <path d="M-48,401 L-48,341 Q-48,321 -28,321 L28,321 Q48,321 48,341 L48,401 Q0,416 -48,401 Z" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M-29,321 Q0,286 29,321 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M-48,360 L-38,368 L-38,390 L-48,396" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M48,360 L38,368 L38,390 L48,396" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
    <g id="ground">
      <line x1="-158" y1="430" x2="158" y2="430" stroke="currentColor" stroke-width="2.5"/>
      <g stroke="currentColor" stroke-width="1" opacity="0.45">
        <line x1="-140" y1="430" x2="-150" y2="442"/><line x1="-90" y1="430" x2="-100" y2="442"/>
        <line x1="-40" y1="430" x2="-50" y2="442"/><line x1="10" y1="430" x2="0" y2="442"/>
        <line x1="60" y1="430" x2="50" y2="442"/><line x1="110" y1="430" x2="100" y2="442"/>
        <line x1="155" y1="430" x2="145" y2="442"/>
      </g>
    </g>
  </defs>

  <text x="26" y="30" font-size="14">TW-2 FERRET · takeoff transformation · front view · 1 px = 0.63 in</text>

  <g transform="translate(0,-170)">
  <!-- ========== BEAT 01 — SPOOL ========== -->
  <g transform="translate(175,0)">
    <use href="#ground"/><use href="#hull"/>
    <g transform="translate(74,382)"><use href="#mod"/></g>
    <g transform="translate(-74,382) scale(-1,1)"><use href="#mod"/></g>
    <path d="M-38,379 Q-18,379 -14,399 L-14,412" fill="none" stroke="#E8571F" stroke-width="2.5" marker-end="url(#fa)" opacity="0.9"/>
    <path d="M38,379 Q18,379 14,399 L14,412" fill="none" stroke="#E8571F" stroke-width="2.5" marker-end="url(#fa)" opacity="0.9"/>
    <line x1="-74" y1="440" x2="74" y2="440" stroke="currentColor" stroke-width="1" marker-start="url(#na)" marker-end="url(#na)"/>
    <text x="0" y="456" text-anchor="middle" font-size="11">track 92</text>
  </g>
  <text x="175" y="500" text-anchor="middle" font-size="15">01 · SPOOL</text>
  <text x="175" y="522" text-anchor="middle">turbines start, wheels still vertical</text>
  <text x="175" y="540" text-anchor="middle" opacity="0.8">flow runs inboard into the flank channel</text>
  <text x="175" y="557" text-anchor="middle" opacity="0.8">and turns aft — ground thrust, no lift</text>
  <text x="175" y="580" text-anchor="middle" font-size="11" fill="#E8571F">~20 s · the move that makes turbines work</text>

  <!-- ========== BEAT 02 — ROLL-IN ========== -->
  <g transform="translate(500,0)">
    <use href="#ground"/><use href="#hull"/>
    <g transform="translate(74,382) rotate(-38)"><use href="#mod"/></g>
    <g transform="translate(-74,382) scale(-1,1) rotate(-38)"><use href="#mod"/></g>
    <path d="M96,342 A54,54 0 0 1 112,374" fill="none" stroke="currentColor" stroke-width="2" marker-start="url(#na)"/>
    <text x="118" y="356" font-size="11">38°</text>
  </g>
  <text x="500" y="500" text-anchor="middle" font-size="15">02 · ROLL-IN</text>
  <text x="500" y="522" text-anchor="middle">tops tip inboard, thrust swings down</text>
  <text x="500" y="540" text-anchor="middle" opacity="0.8">lateral halves still cancel; vertical</text>
  <text x="500" y="557" text-anchor="middle" opacity="0.8">component unloads the suspension</text>
  <text x="500" y="580" text-anchor="middle" font-size="11" fill="#E8571F">tilt is the throttle — the core never changes speed</text>

  <!-- ========== BEAT 03 — SLIDE-OUT ========== -->
  <g transform="translate(825,0)">
    <use href="#ground"/><use href="#hull"/>
    <g transform="translate(109,382) rotate(-38)"><use href="#mod"/></g>
    <g transform="translate(-109,382) scale(-1,1) rotate(-38)"><use href="#mod"/></g>
    <g opacity="0.3"><g transform="translate(74,382) rotate(-38)"><use href="#mod"/></g>
      <g transform="translate(-74,382) scale(-1,1) rotate(-38)"><use href="#mod"/></g></g>
    <line x1="74" y1="316" x2="109" y2="316" stroke="currentColor" stroke-width="1.5" marker-end="url(#na)"/>
    <line x1="-74" y1="316" x2="-109" y2="316" stroke="currentColor" stroke-width="1.5" marker-end="url(#na)"/>
    <text x="92" y="308" text-anchor="middle" font-size="11">22</text>
    <text x="-92" y="308" text-anchor="middle" font-size="11">22</text>
  </g>
  <text x="825" y="500" text-anchor="middle" font-size="15">03 · SLIDE-OUT</text>
  <text x="825" y="522" text-anchor="middle">modules translate outboard on rails</text>
  <text x="825" y="540" text-anchor="middle" opacity="0.8">clears the disc from the hull before it</text>
  <text x="825" y="557" text-anchor="middle" opacity="0.8">can go flat; widens the stance for flight</text>
  <text x="825" y="580" text-anchor="middle" font-size="11" fill="#E8571F">narrow on the road, wide in the air</text>

  <!-- ========== BEAT 04 — ROLL-OUT ========== -->
  <g transform="translate(1150,-34)">
    <g transform="translate(0,34)"><use href="#ground"/></g>
    <use href="#hull"/>
    <g transform="translate(109,382) rotate(-95)"><use href="#mod"/></g>
    <g transform="translate(-109,382) scale(-1,1) rotate(-95)"><use href="#mod"/></g>
    <line x1="-109" y1="306" x2="109" y2="306" stroke="currentColor" stroke-width="1" marker-start="url(#na)" marker-end="url(#na)"/>
    <text x="0" y="298" text-anchor="middle" font-size="11">track 136</text>
  </g>
  <text x="1150" y="500" text-anchor="middle" font-size="15">04 · ROLL-OUT</text>
  <text x="1150" y="522" text-anchor="middle">rotation completes to 95°, discs flat</text>
  <text x="1150" y="540" text-anchor="middle" opacity="0.8">thrust fully vertical, inflow clean</text>
  <text x="1150" y="557" text-anchor="middle" opacity="0.8">of the hull — the vehicle leaves the ground</text>
  <text x="1150" y="580" text-anchor="middle" font-size="11" fill="#E8571F">~6 s from spooled to airborne</text>

  </g>
  <text x="26" y="444" font-size="12" opacity="0.8">Landing reverses the order: settle wide, roll in to 38° to unload, slide in, roll down to vertical onto the tires.</text>
</svg>
