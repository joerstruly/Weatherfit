<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" id="pwr" aria-label="Power required against airspeed for the TW-2 at 2,700 pounds. Both curves begin at the 780 horsepower hover requirement. On the wheels alone, power dips near 100 mph and crosses the installed-power line at 152 mph, the top speed; best range is 140 mph for 106 miles. With a 16 foot deployable span the wing offloads the rotors above about 80 mph: best range falls to 387 horsepower at 125 mph for 173 miles and top speed rises to 172 mph. Hover sets the installed power; cruise sets the fuel." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
