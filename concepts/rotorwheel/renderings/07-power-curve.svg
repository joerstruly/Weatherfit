<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" id="pwr" aria-label="Power required against airspeed for the RW-2S. Both curves start at the 350 kilowatt hover requirement at zero speed. Rotors alone: power dips to about 286 kilowatts near 125 km/h, then climbs and crosses the 350 kilowatt installed-power line at 197 km/h, the top speed. With a 4 metre deployable span the wing offloads the rotors above about 120 km/h: cruise power at 180 km/h falls from about 320 to about 226 kilowatts and top speed rises to 227 km/h. Hover sets the installed power; cruise sets the energy." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
