<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" id="pwr" aria-label="Power required against airspeed for the RW-2S. Both curves start at the 469 horsepower hover requirement at zero speed. Rotors alone: power dips to about 384 horsepower near 78 mph, then climbs and crosses the 469 horsepower installed-power line at 122 mph, the top speed. With a 13 ft deployable span the wing offloads the rotors above about 75 mph: cruise power at 112 mph falls from about 429 to about 303 horsepower and top speed rises to 141 mph. Hover sets the installed power; cruise sets the energy." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
