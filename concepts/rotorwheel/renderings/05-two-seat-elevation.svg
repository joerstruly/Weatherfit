<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="RW-2S two-seat variant, side elevation in drive mode with the hull sectioned on the centerline: a 4.6 metre cambered hull slung between four 1.4 metre coaxial rotor-wheels that carry all the lift, a bubble canopy over a two-seat cabin, a turboshaft generator and fuel in the tail, battery in the nose, flip pivots at the same height front and rear; a 1.8 metre standing figure for scale." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
    <linearGradient id="hullg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E7A5A"/><stop offset="1" stop-color="#3E4634"/>
    </linearGradient>
    <linearGradient id="glassg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE9F0"/><stop offset="1" stop-color="#8FB0C4"/>
    </linearGradient>
    <g id="w5">
      <circle r="77" fill="#24271F" stroke="#111" stroke-width="2.5"/>
      <circle r="64" fill="#3B3F35" stroke="#E8571F" stroke-width="3"/>
      <g stroke="#E8571F" stroke-width="6" stroke-linecap="round">
        <line x1="13" y1="0" x2="58" y2="0"/><line x1="8" y1="10" x2="36" y2="45"/>
        <line x1="-3" y1="13" x2="-13" y2="57"/><line x1="-12" y1="6" x2="-52" y2="25"/>
        <line x1="-12" y1="-6" x2="-52" y2="-25"/><line x1="-3" y1="-13" x2="-13" y2="-57"/>
        <line x1="8" y1="-10" x2="36" y2="-45"/>
      </g>
      <g stroke="#E8571F" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5" opacity="0.7">
        <line x1="12" y1="6" x2="50" y2="24"/><line x1="3" y1="13" x2="12" y2="54"/>
        <line x1="-8" y1="10" x2="-35" y2="43"/><line x1="-13" y1="0" x2="-56" y2="0"/>
        <line x1="-8" y1="-10" x2="-35" y2="-43"/><line x1="3" y1="-13" x2="12" y2="-54"/>
        <line x1="12" y1="-6" x2="50" y2="-24"/>
      </g>
      <circle r="10" fill="#C9CCC3"/>
    </g>
  </defs>

  <!-- ground -->
  <rect x="0" y="400" width="900" height="80" fill="currentColor" opacity="0.06"/>
  <line x1="30" y1="400" x2="870" y2="400" stroke="currentColor" stroke-width="2"/>

  <!-- scale figure, 1.8 m -->
  <g stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="70" cy="212" r="9"/>
    <line x1="70" y1="221" x2="70" y2="300"/>
    <line x1="70" y1="300" x2="60" y2="398"/><line x1="70" y1="300" x2="80" y2="398"/>
    <line x1="70" y1="240" x2="55" y2="285"/><line x1="70" y1="240" x2="85" y2="285"/>
  </g>
  <text x="36" y="195" font-size="11">1.8 m</text>

  <!-- wheels, ghosted (outboard) -->
  <g opacity="0.42">
    <use href="#w5" x="301" y="323"/>
    <use href="#w5" x="609" y="323"/>
  </g>

  <!-- hull -->
  <path d="M180,335 C220,290 300,235 400,235 C520,235 620,245 686,262 L686,296 C620,330 560,350 480,350 L250,350 C215,350 195,345 180,335 Z" fill="url(#hullg)" stroke="#20241E" stroke-width="2"/>
  <!-- flip pivots, same height -->
  <circle cx="301" cy="300" r="7" fill="#C9CCC3" stroke="#20241E" stroke-width="1.5"/>
  <circle cx="609" cy="300" r="7" fill="#C9CCC3" stroke="#20241E" stroke-width="1.5"/>
  <!-- canopy -->
  <path d="M362,238 C395,185 480,183 505,242 Z" fill="url(#glassg)" stroke="#20241E" stroke-width="1.5" opacity="0.85"/>
  <!-- seated figure, ghosted -->
  <g stroke="#20241E" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55">
    <circle cx="418" cy="212" r="8"/>
    <line x1="416" y1="220" x2="408" y2="276"/>
    <line x1="408" y1="276" x2="450" y2="278"/>
    <line x1="450" y1="278" x2="456" y2="316"/>
  </g>
  <!-- internal arrangement (section) -->
  <g fill="none" stroke="#EDEFE6" stroke-width="1.4" stroke-dasharray="5 3">
    <rect x="512" y="268" width="110" height="34"/>
    <rect x="522" y="310" width="120" height="32"/>
    <rect x="205" y="300" width="80" height="40"/>
  </g>
  <line x1="686" y1="278" x2="712" y2="278" stroke="#6B6F66" stroke-width="10"/>

  <!-- callouts -->
  <g stroke="currentColor" stroke-width="1">
    <line x1="250" y1="300" x2="230" y2="222"/>
    <line x1="567" y1="285" x2="600" y2="384"/>
    <line x1="582" y1="342" x2="640" y2="384"/>
    <line x1="245" y1="340" x2="200" y2="384"/>
    <line x1="308" y1="300" x2="330" y2="380"/>
    <line x1="609" y1="246" x2="700" y2="214"/>
  </g>
  <text x="120" y="216" font-size="11">rotor-wheels Ø 1.4 · 2× Ø 1.2 coaxial fans · printed airless tire</text>
  <text x="530" y="388" font-size="11">turboshaft genset ~350 kW</text>
  <text x="644" y="404" font-size="11">fuel 80 kg</text>
  <text x="120" y="388" font-size="11">battery 15 kWh</text>
  <text x="300" y="393" font-size="11">flip pivots, same height, same arms</text>
  <text x="704" y="210" font-size="11">rear rotor-wheel</text>

  <!-- dimensions -->
  <g stroke="currentColor" stroke-width="1">
    <line x1="180" y1="408" x2="180" y2="446"/><line x1="686" y1="408" x2="686" y2="446"/>
    <line x1="187" y1="438" x2="679" y2="438" marker-start="url(#a5)" marker-end="url(#a5)"/>
    <line x1="520" y1="190" x2="860" y2="190"/><line x1="700" y1="400" x2="860" y2="400"/>
    <line x1="852" y1="197" x2="852" y2="393" marker-start="url(#a5)" marker-end="url(#a5)"/>
  </g>
  <text x="433" y="431" text-anchor="middle">4.6 m</text>
  <text x="860" y="300">1.9 m</text>
  <text x="30" y="468" font-size="13">RW-2S · two-seat variant · side elevation, section on centerline · DRIVE MODE · 2.2 m overall width</text>
</svg>
