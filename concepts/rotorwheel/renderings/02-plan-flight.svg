<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-label="RW-5 plan view in flight mode: four 520 mm fan discs deployed horizontally at the corners on swing-arms, central hull, tail fan aft; flight footprint 1,560 by 1,640 mm." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
    <g id="fandisc">
      <circle r="130" fill="none" stroke="currentColor" stroke-width="6"/>
      <circle r="105" fill="none" stroke="#E8571F" stroke-width="3"/>
      <circle r="18" fill="currentColor"/>
      <g stroke="#E8571F" stroke-width="7" stroke-linecap="round">
        <line x1="22" y1="0" x2="98" y2="0"/>
        <line x1="14" y1="17" x2="61" y2="77"/>
        <line x1="-5" y1="22" x2="-22" y2="96"/>
        <line x1="-20" y1="10" x2="-88" y2="43"/>
        <line x1="-20" y1="-10" x2="-88" y2="-43"/>
        <line x1="-5" y1="-22" x2="-22" y2="-96"/>
        <line x1="14" y1="-17" x2="61" y2="-77"/>
      </g>
    </g>
  </defs>

  <!-- centerline -->
  <line x1="200" y1="450" x2="1070" y2="450" stroke="currentColor" stroke-width="1" stroke-dasharray="14 4 3 4" opacity="0.55"/>

  <!-- swing arms -->
  <g stroke="currentColor" stroke-width="10" stroke-linecap="round">
    <line x1="370" y1="375" x2="370" y2="210"/>
    <line x1="370" y1="525" x2="370" y2="690"/>
    <line x1="680" y1="375" x2="680" y2="210"/>
    <line x1="680" y1="525" x2="680" y2="690"/>
  </g>

  <!-- hull -->
  <path d="M280,375 L230,450 L280,525 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <rect x="280" y="375" width="540" height="150" rx="10" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <rect x="820" y="435" width="70" height="30" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- fan discs -->
  <use href="#fandisc" x="370" y="190"/>
  <use href="#fandisc" x="370" y="710"/>
  <use href="#fandisc" x="680" y="190"/>
  <use href="#fandisc" x="680" y="710"/>

  <!-- tail fan -->
  <g>
    <circle cx="960" cy="450" r="90" fill="none" stroke="currentColor" stroke-width="5"/>
    <circle cx="960" cy="450" r="76" fill="none" stroke="#E8571F" stroke-width="2.5"/>
    <circle cx="960" cy="450" r="14" fill="currentColor"/>
    <g stroke="#E8571F" stroke-width="6" stroke-linecap="round">
      <line x1="978" y1="450" x2="1030" y2="450"/>
      <line x1="942" y1="450" x2="890" y2="450"/>
      <line x1="960" y1="468" x2="960" y2="520"/>
      <line x1="960" y1="432" x2="960" y2="380"/>
    </g>
  </g>

  <!-- callouts -->
  <line x1="680" y1="58" x2="706" y2="46" stroke="currentColor" stroke-width="1"/>
  <text x="712" y="36">fan discs horizontal —</text>
  <text x="712" y="54">wheels tilted 95° on swing-arms</text>
  <line x1="960" y1="555" x2="960" y2="600" stroke="currentColor" stroke-width="1"/>
  <text x="700" y="622">tail fan · tilts aft for cruise thrust</text>
  <line x1="900" y1="655" x2="1000" y2="655" stroke="#E8571F" stroke-width="3" marker-end="url(#a2)" color="#E8571F"/>
  <text x="1012" y="659" fill="#E8571F">thrust</text>

  <!-- dimensions -->
  <g stroke="currentColor" stroke-width="1">
    <line x1="240" y1="60" x2="130" y2="60"/>
    <line x1="240" y1="840" x2="130" y2="840"/>
    <line x1="140" y1="70" x2="140" y2="830" marker-start="url(#a2)" marker-end="url(#a2)"/>
    <line x1="230" y1="535" x2="230" y2="880"/>
    <line x1="1050" y1="550" x2="1050" y2="880"/>
    <line x1="238" y1="872" x2="1042" y2="872" marker-start="url(#a2)" marker-end="url(#a2)"/>
  </g>
  <text x="152" y="455">1,560</text>
  <text x="640" y="864" text-anchor="middle">1,640</text>
  <text x="60" y="30" font-size="13">RW-5 FERRET · plan view · FLIGHT MODE · dims in mm</text>
</svg>
