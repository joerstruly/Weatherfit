<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="RW-5 side elevation in drive mode: two 520 mm rotor-wheels with 420 mm ducted fans visible in their centers, hull slung between, EO/IR mast up, tail fan pylon folded flat; principal dimensions 1,080 mm length, 640 mm height, 190 mm ground clearance." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ground -->
  <line x1="60" y1="410" x2="840" y2="410" stroke="currentColor" stroke-width="2"/>
  <g stroke="currentColor" stroke-width="1" opacity="0.5">
    <line x1="80" y1="410" x2="70" y2="422"/><line x1="140" y1="410" x2="130" y2="422"/>
    <line x1="200" y1="410" x2="190" y2="422"/><line x1="640" y1="410" x2="630" y2="422"/>
    <line x1="700" y1="410" x2="690" y2="422"/><line x1="760" y1="410" x2="750" y2="422"/>
    <line x1="820" y1="410" x2="810" y2="422"/>
  </g>

  <!-- hull -->
  <path d="M215,300 L237,255 L700,250 L755,278 L755,315 L237,315 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- battery cassette -->
  <rect x="662" y="260" width="78" height="50" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- tail fan pylon, folded -->
  <rect x="600" y="230" width="150" height="18" rx="9" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="612" y1="239" x2="738" y2="239" stroke="#E8571F" stroke-width="2"/>
  <!-- EO/IR mast -->
  <line x1="330" y1="252" x2="330" y2="138" stroke="currentColor" stroke-width="3"/>
  <circle cx="330" cy="118" r="20" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <rect x="322" y="110" width="16" height="9" fill="currentColor"/>

  <!-- front rotor-wheel -->
  <g>
    <circle cx="280" cy="280" r="130" fill="none" stroke="currentColor" stroke-width="6"/>
    <circle cx="280" cy="280" r="112" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="280" cy="280" r="105" fill="none" stroke="#E8571F" stroke-width="3"/>
    <circle cx="280" cy="280" r="18" fill="currentColor"/>
    <g stroke="#E8571F" stroke-width="7" stroke-linecap="round">
      <line x1="302" y1="280" x2="378" y2="280"/>
      <line x1="294" y1="297" x2="341" y2="357"/>
      <line x1="275" y1="302" x2="258" y2="376"/>
      <line x1="260" y1="290" x2="192" y2="323"/>
      <line x1="260" y1="270" x2="192" y2="237"/>
      <line x1="275" y1="258" x2="258" y2="184"/>
      <line x1="294" y1="263" x2="341" y2="203"/>
    </g>
  </g>
  <!-- rear rotor-wheel -->
  <g>
    <circle cx="590" cy="280" r="130" fill="none" stroke="currentColor" stroke-width="6"/>
    <circle cx="590" cy="280" r="112" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="590" cy="280" r="105" fill="none" stroke="#E8571F" stroke-width="3"/>
    <circle cx="590" cy="280" r="18" fill="currentColor"/>
    <g stroke="#E8571F" stroke-width="7" stroke-linecap="round">
      <line x1="612" y1="280" x2="688" y2="280"/>
      <line x1="604" y1="297" x2="651" y2="357"/>
      <line x1="585" y1="302" x2="568" y2="376"/>
      <line x1="570" y1="290" x2="502" y2="323"/>
      <line x1="570" y1="270" x2="502" y2="237"/>
      <line x1="585" y1="258" x2="568" y2="184"/>
      <line x1="604" y1="263" x2="651" y2="203"/>
    </g>
  </g>

  <!-- callouts -->
  <g stroke="currentColor" stroke-width="1">
    <line x1="341" y1="118" x2="410" y2="95"/>
    <line x1="675" y1="230" x2="700" y2="185"/>
    <line x1="206" y1="354" x2="140" y2="386"/>
    <line x1="664" y1="206" x2="704" y2="162"/>
  </g>
  <text x="416" y="98">EO/IR gimbal, stowable mast</text>
  <text x="706" y="180">tail fan pylon (folded)</text>
  <text x="60" y="400">Ø 520 tire</text>
  <text x="710" y="156">fan Ø 420</text>

  <!-- dimensions -->
  <g stroke="currentColor" stroke-width="1">
    <line x1="215" y1="418" x2="215" y2="458"/>
    <line x1="755" y1="418" x2="755" y2="458"/>
    <line x1="222" y1="450" x2="748" y2="450" marker-start="url(#a1)" marker-end="url(#a1)"/>
    <line x1="765" y1="410" x2="835" y2="410"/>
    <line x1="330" y1="98" x2="828" y2="98"/>
    <line x1="820" y1="105" x2="820" y2="403" marker-start="url(#a1)" marker-end="url(#a1)"/>
    <line x1="463" y1="315" x2="463" y2="410" marker-start="url(#a1)" marker-end="url(#a1)"/>
  </g>
  <text x="470" y="443" text-anchor="middle">1,080</text>
  <text x="833" y="260">640</text>
  <text x="472" y="368">190</text>
  <text x="60" y="480" font-size="13">RW-5 FERRET · side elevation · DRIVE MODE · dims in mm</text>
</svg>
