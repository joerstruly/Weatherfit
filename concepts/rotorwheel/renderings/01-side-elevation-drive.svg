<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="RW-5 side elevation in drive mode, sectioned on the centerline: a cambered lifting-body hull with a low nose, thickest ahead of mid-chord and tapering to a blunt tail; the embedded rear lift fan lies flat inside the hull with its inlet doors closed and a vane box beneath; the four 400 mm wheels with two-stage coaxial fans are shown ghosted outboard; principal dimensions 1,200 mm length, 460 mm height, 150 mm ground clearance." font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
    <g id="w1">
      <circle r="100" fill="none" stroke="currentColor" stroke-width="6"/>
      <circle r="84" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle r="80" fill="none" stroke="#E8571F" stroke-width="2.5"/>
      <circle r="14" fill="currentColor"/>
      <g stroke="#E8571F" stroke-width="6" stroke-linecap="round">
        <line x1="18" y1="0" x2="74" y2="0"/>
        <line x1="11" y1="14" x2="46" y2="58"/>
        <line x1="-4" y1="18" x2="-17" y2="72"/>
        <line x1="-16" y1="8" x2="-67" y2="32"/>
        <line x1="-16" y1="-8" x2="-67" y2="-32"/>
        <line x1="-4" y1="-18" x2="-17" y2="-72"/>
        <line x1="11" y1="-14" x2="46" y2="-58"/>
      </g>
      <g stroke="#E8571F" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5" opacity="0.7">
        <line x1="16" y1="8" x2="63" y2="30"/>
        <line x1="4" y1="18" x2="16" y2="68"/>
        <line x1="-11" y1="14" x2="-44" y2="55"/>
        <line x1="-18" y1="0" x2="-70" y2="0"/>
        <line x1="-11" y1="-14" x2="-44" y2="-55"/>
        <line x1="4" y1="-18" x2="16" y2="-68"/>
        <line x1="16" y1="-8" x2="63" y2="-30"/>
      </g>
    </g>
  </defs>

  <!-- ground -->
  <line x1="60" y1="380" x2="840" y2="380" stroke="currentColor" stroke-width="2"/>
  <g stroke="currentColor" stroke-width="1" opacity="0.5">
    <line x1="80" y1="380" x2="70" y2="392"/><line x1="140" y1="380" x2="130" y2="392"/>
    <line x1="700" y1="380" x2="690" y2="392"/><line x1="760" y1="380" x2="750" y2="392"/>
    <line x1="820" y1="380" x2="810" y2="392"/>
  </g>

  <!-- wheels, ghosted (outboard of the section plane) -->
  <g opacity="0.32">
    <use href="#w1" x="250" y="280"/>
    <use href="#w1" x="610" y="280"/>
  </g>

  <!-- lifting-body hull, centerline section -->
  <path d="M190,300 C230,240 330,198 430,198 C560,198 700,215 790,235 L790,270 C700,290 640,305 600,305 L250,305 C220,305 200,303 190,300 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- embedded rear lift fan, edge-on -->
  <rect x="465" y="232" width="190" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="560" y1="238" x2="560" y2="266" stroke="#E8571F" stroke-width="3"/>
  <line x1="475" y1="252" x2="645" y2="252" stroke="#E8571F" stroke-width="2"/>
  <!-- inlet doors, closed -->
  <line x1="462" y1="205" x2="658" y2="212" stroke="currentColor" stroke-width="2.5"/>
  <!-- vane box under fan -->
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="480" y1="290" x2="480" y2="305"/><line x1="500" y1="290" x2="500" y2="305"/>
    <line x1="520" y1="290" x2="520" y2="305"/><line x1="540" y1="290" x2="540" y2="305"/>
    <line x1="560" y1="290" x2="560" y2="305"/><line x1="580" y1="290" x2="580" y2="305"/>
    <line x1="600" y1="290" x2="600" y2="305"/><line x1="620" y1="290" x2="620" y2="305"/>
    <line x1="640" y1="290" x2="640" y2="305"/>
  </g>
  <!-- battery cassette -->
  <rect x="280" y="238" width="150" height="58" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- EO/IR mast -->
  <line x1="330" y1="208" x2="330" y2="182" stroke="currentColor" stroke-width="3"/>
  <circle cx="330" cy="166" r="16" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <rect x="324" y="160" width="12" height="7" fill="currentColor"/>

  <!-- callouts -->
  <g stroke="currentColor" stroke-width="1">
    <line x1="500" y1="198" x2="520" y2="150"/>
    <line x1="560" y1="232" x2="700" y2="120"/>
    <line x1="600" y1="303" x2="700" y2="340"/>
    <line x1="176" y1="342" x2="120" y2="342"/>
    <line x1="354" y1="238" x2="420" y2="120"/>
    <line x1="500" y1="290" x2="470" y2="345"/>
  </g>
  <text x="524" y="146">inlet doors (closed in drive)</text>
  <text x="704" y="116">lift fan Ø 380, edge-on</text>
  <text x="704" y="356">vane box · 0–50° aft</text>
  <text x="60" y="336" font-size="11">Ø 400 tire</text>
  <text x="60" y="350" font-size="11">2× Ø 320 coaxial</text>
  <text x="424" y="116">cambered lifting body</text>
  <text x="380" y="360">battery cassette</text>

  <!-- dimensions -->
  <g stroke="currentColor" stroke-width="1">
    <line x1="190" y1="388" x2="190" y2="428"/>
    <line x1="790" y1="388" x2="790" y2="428"/>
    <line x1="197" y1="420" x2="783" y2="420" marker-start="url(#a1)" marker-end="url(#a1)"/>
    <line x1="800" y1="380" x2="835" y2="380"/>
    <line x1="350" y1="150" x2="835" y2="150"/>
    <line x1="828" y1="157" x2="828" y2="373" marker-start="url(#a1)" marker-end="url(#a1)"/>
    <line x1="430" y1="305" x2="430" y2="380" marker-start="url(#a1)" marker-end="url(#a1)"/>
  </g>
  <text x="490" y="413" text-anchor="middle">1,200</text>
  <text x="840" y="270">460</text>
  <text x="438" y="348">150</text>
  <text x="60" y="455" font-size="13">RW-5 FERRET · side elevation, section on centerline · DRIVE MODE · wheels ghosted · dims in mm</text>
</svg>
