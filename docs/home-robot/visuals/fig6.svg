<svg viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Timeline comparing 26 minutes of sequential human dishwashing against 6.5 minutes for the robot, whose two arms, two helpers and wand work in parallel while the dishwasher cycle stays the same" xmlns="http://www.w3.org/2000/svg">
<style>
