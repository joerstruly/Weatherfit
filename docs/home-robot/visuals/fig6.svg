<text class="lbl" x="459.8" y="220">17 min · 0 min of attention</text>
<text class="muted" x="40" y="370">robot per-grasp speed assumed 0.8× human at maturity; the gain comes from three effectors working in parallel,</text>
<text class="muted" x="40" y="386">not from faster hands. The dishwasher cycle (≈2 h) is unchanged, so wall-clock to "done" barely moves.</text></svg>