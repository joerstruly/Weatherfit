<svg viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Timeline comparing 26 minutes of sequential human dishwashing against 5 minutes for the robot, whose four arms, two helpers and wand work in parallel while the dishwasher cycle stays the same" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { color:#1F2A33; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .paper { fill:#F5F6F3; }
